name: package-linux

# 构建 pi-web + pi CLI 的 Linux 离线分发包。
#   - 推送 v* tag 时自动构建，并把产物上传到对应的 GitHub Release；
#   - 也可以手动触发（Actions 页面 "Run workflow"）。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build offline Linux package
        run: bash scripts/package-linux.sh
        env:
          # 可选：指向自编译的 pi-coding-agent 安装包（.tgz / 目录 / https URL）。
          # 有私有托管地址时，在仓库 Settings -> Secrets and variables -> Actions
          # -> Variables 里配置同名变量，CI 构建就会自动替换 registry 版本。
          PI_CODING_AGENT_LOCAL: ${{ vars.PI_CODING_AGENT_LOCAL }}
          # 可选：内置 Node 运行时来源（.tar.gz/.tar.xz 包 / 解压目录 / https URL
          # 内网镜像），不访问 nodejs.org。同样在仓库 Variables 里配置。
          NODE_RUNTIME_LOCAL: ${{ vars.NODE_RUNTIME_LOCAL }}
          # 可选：pi 配置模板目录（扩展/模型接口等配置）。CI 里通常不设，
          # 直接把模板放仓库 pi-config/ 目录即可自动打包（本地构建可用
          # PI_CONFIG_DIR 指定 ~/.pi 等其他位置）。
          PI_CONFIG_DIR: ${{ vars.PI_CONFIG_DIR }}
          # 可选：配置模板版本号（默认 1）。发布新版包时递增，目标机增量更新。
          PI_CONFIG_VERSION: ${{ vars.PI_CONFIG_VERSION }}
          # 可选：空格分隔的本地扩展目录列表（相对路径按仓库根目录解析）。
          # 打包时预装依赖并随配置模板分发，目标机离线加载（见 scripts/README.md）。
          PI_EXTENSIONS: ${{ vars.PI_EXTENSIONS }}
          # 可选：更新源目录（托管 versions.json）。未设置时 update.sh 从
          # app/package.json 的 repository 推导 GitHub Releases latest/download，
          # 并靠下面生成的 versions.json asset 生效（内网分发请设置本变量）。
          PI_UPDATE_BASE_URL: ${{ vars.PI_UPDATE_BASE_URL }}

      - name: Generate versions.json update manifest (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ARCH="$(basename "$(ls -d build/package-linux/pi-linux-* | head -n1)")"
          ARCH="${ARCH#pi-linux-}"
          VERSION="$(cat "build/package-linux/pi-linux-$ARCH/VERSION.txt")"
          SHA="$(awk '{print $1}' dist/SHA256SUMS)"
          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%d)" \
            --arg u "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/pi-linux-$ARCH-$VERSION.tar.gz" \
            --arg s "$SHA" \
            '{version:$v, date:$d, url:$u, sha256:$s}' > dist/versions.json
          echo "versions.json:"
          cat dist/versions.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-linux-offline
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/versions.json

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release 可能尚未创建（docs/release.md 里是手动 gh release create），
          # 不存在时先自动创建，避免 tag 推送先于 release 导致上传失败。
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/versions.json --clobber
